<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖書館箱書預約系統</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-hover: #3b5984;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --status-ready: #2e7d32;
            --status-ready-bg: #e8f5e9;
            --status-reserved: #e65100;
            --status-reserved-bg: #fff3e0;
            --status-borrowed: #c62828;
            --status-borrowed-bg: #ffebee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .role-badge {
            font-size: 0.9rem;
            padding: 6px 12px;
            background: #f0f0f0;
            border-radius: 20px;
            font-weight: 600;
        }

        button, .btn-link {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        button:hover, .btn-link:hover {
            background-color: var(--primary-hover);
        }

        .btn-opac {
            background-color: #7C2D12;
        }
        .btn-opac:hover {
            background-color: #4A3E3D;
        }

        .btn-checkout {
            background-color: #2e7d32;
        }
        .btn-checkout:hover {
            background-color: #1b5e20;
        }

        .btn-return {
            background-color: #e65100;
        }
        .btn-return:hover {
            background-color: #bf360c;
        }

        .btn-edit {
            background-color: #0288d1;
        }
        .btn-edit:hover {
            background-color: #01579b;
        }

        .btn-delete {
            background-color: #d32f2f;
        }
        .btn-delete:hover {
            background-color: #b71c1c;
        }

        /* 注意事項面板樣式 */
        .notice-panel {
            background-color: #FFF7ED;
            border-left: 5px solid #FFEAD5;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 20px;
            color: #5d4037;
        }

        .notice-panel h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #e65100;
        }

        .notice-panel ol {
            margin: 0;
            padding-left: 20px;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .panel {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #444;
        }

        .form-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"], input[type="number"], select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--primary);
        }

        /* 篩選列統一樣式 */
        .filter-row {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #555;
        }

        .tag-btn {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn:hover {
            background-color: #dee2e6;
        }

        .tag-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 狀態快篩專屬按鈕樣式 */
        .status-filter-btn {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            color: #495057;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
        }
        .status-filter-btn.active {
            background-color: #334155;
            color: white;
            border-color: #334155;
        }

        .tag-badge {
            display: inline-block;
            background-color: #e2e8f0;
            color: #475569;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 4px;
            margin-bottom: 2px;
        }

        /* 表格樣式 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-ready { background-color: var(--status-ready-bg); color: var(--status-ready); }
        .status-reserved { background-color: var(--status-reserved-bg); color: var(--status-reserved); }
        .status-borrowed { background-color: var(--status-borrowed-bg); color: var(--status-borrowed); }

        .opac-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .opac-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .staff-header-active {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #b78103;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 分頁控制列 */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .page-info {
            font-size: 0.9rem;
            color: #666;
        }

        .page-buttons {
            display: flex;
            gap: 5px;
        }

        .page-btn {
            background-color: #ffffff;
            color: #333;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .page-btn:hover {
            background-color: #f1f5f9;
        }

        .page-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .loading-spin {
            display: inline-block;
            animation: spin 1s infinite linear;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 圖書館箱書預約系統</h1>
            <div class="role-section">
                <span id="syncStatus" style="font-size:0.85rem; color:#666; font-weight:600;"></span>
                <div id="roleBadge" class="role-badge">當前身分：📖 班級預約模式</div>
                <a href="https://esa.ntpc.edu.tw/014579/library" target="_blank" class="btn-link btn-opac">館藏查詢</a>
                <button id="authBtn" onclick="toggleMode()">閱推老師登入</button>
            </div>
        </header>

        <div id="staffHeader" class="hidden">
            <span>⚙️ 閱推老師管理模式已啟用 (可進行箱書歸還、確認借出與後台編輯)</span>
        </div>

        <!-- 📌 預約與領取注意事項 -->
        <div class="notice-panel">
            <h3>預約與領取注意事項</h3>
            <ol>
                <li>為利箱書準備，<b>請至少提前一天辦理線上預約。</b></li>
                <li>完成線上預約後，請於<b>預約隔日起</b>至教務處洽<b>閱推老師</b>辦理正式借出與領取箱書。</li>
            </ol>
        </div>

        <!-- 🔍 狀態快速篩選列 (新增：讓老師與班級一鍵篩選狀態) -->
        <div class="filter-row">
            <span class="filter-title">⚡ 狀態快篩：</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                <button class="status-filter-btn active" onclick="filterByStatus('ALL')" id="statusAll">全部箱書</button>
                <button class="status-filter-btn" onclick="filterByStatus('可借閱')" id="statusReady">🟢 可借閱</button>
                <button class="status-filter-btn" onclick="filterByStatus('已預約')" id="statusReserved">🟠 已預約</button>
                <button class="status-filter-btn" onclick="filterByStatus('已借出')" id="statusBorrowed">🔴 已借出</button>
            </div>
        </div>

        <!-- 標籤篩選列 -->
        <div class="filter-row">
            <span class="filter-title">🏷️ 標籤篩選：</span>
            <div id="tagFilterButtons" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
        </div>

        <!-- 班級預約面板 -->
        <div class="panel">
            <h2>📖 班級預約箱書</h2>
            <div class="form-group">
                <select id="selectBox" style="min-width: 250px;"></select>
                <input type="text" id="classInput" placeholder="請輸入班級 (例如: 801)" style="width: 180px;">
                <button id="btnReserve" onclick="reserveBox()">送出預約</button>
            </div>
        </div>

        <!-- 前台箱書清單表格 -->
        <div class="table-header-controls">
            <h2 style="margin: 0; font-size: 1.2rem; color: #444;">📦 箱書清單</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="btnRefresh" onclick="syncFromGoogleSheets()" style="background-color: #ced4da; padding: 4px 10px; font-size: 0.85rem;">⟳ </button>
                <label for="pageSizeSelect" style="font-size: 0.9rem; color: #666;">每頁顯示：</label>
                <select id="pageSizeSelect" onchange="changePageSize()">
                    <option value="10" selected>10 筆</option>
                    <option value="20">20 筆</option>
                    <option value="50">50 筆</option>
                </select>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">箱號</th>
                    <th>主題名稱</th>
                    <th>主題標籤</th>
                    <th style="width: 80px;">冊數</th>
                    <th style="width: 110px;">目前狀態</th>
                    <th style="width: 130px;">預約/借閱班級</th>
                    <th class="staff-col hidden" style="width: 150px;">管理操作</th>
                </tr>
            </thead>
            <tbody id="boxTableBody"></tbody>
        </table>

        <!-- 前台分頁器 -->
        <div class="pagination-container">
            <div id="pageInfo" class="page-info"></div>
            <div id="paginationButtons" class="page-buttons"></div>
        </div>

        <!-- 後台管理區塊 (閱推老師) -->
        <div id="staffPanel" class="panel hidden" style="margin-top: 40px; border-color: #ffe082; background-color: #fffde7;">
            <h2>🛠️ 閱推老師管理後台</h2>
            
            <h3 style="font-size: 1rem; margin-top: 0;">➕ 新增箱書</h3>
            <div class="form-group" style="margin-bottom: 25px;">
                <input type="text" id="newId" placeholder="箱號 (例: BOX-004)" style="width: 120px;">
                <input type="text" id="newTopic" placeholder="主題 (例: 歷史故事)" style="width: 200px;">
                <input type="text" id="newTags" placeholder="標籤 (半角逗號隔開, 例: 歷史,故事)" style="width: 250px;">
                <input type="number" id="newCount" placeholder="冊數" style="width: 80px;">
                <button onclick="addNewBox()">新增箱書</button>
            </div>

            <div class="table-header-controls">
                <h3 style="font-size: 1rem; margin: 0;">📋 管理清單 (支援編輯與刪除)</h3>
                <div>
                    <label for="mgmtPageSizeSelect" style="font-size: 0.85rem; color: #666;">後台每頁：</label>
                    <select id="mgmtPageSizeSelect" onchange="changeMgmtPageSize()">
                        <option value="10" selected>10 筆</option>
                        <option value="20">20 筆</option>
                    </select>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 100px;">箱號</th>
                        <th>主題名稱</th>
                        <th>主題標籤</th>
                        <th style="width: 80px;">冊數</th>
                        <th style="width: 110px;">狀態</th>
                        <th style="width: 160px;">操作</th>
                    </tr>
                </thead>
                <tbody id="mgmtTableBody"></tbody>
            </table>

            <div class="pagination-container">
                <div id="mgmtPageInfo" class="page-info"></div>
                <div id="mgmtPaginationButtons" class="page-buttons"></div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykd777KYnNgPSWZFU7bGyMV4Vq2qMYTvo-FKOhQRxVMoCoZqmUUkyA2ARigm8GJK9L/exec";
        const STAFF_PASSWORD = "0000";
        let isStaff = false;

        const defaultBoxes = [
            { id: "BOX-001", topic: "兒童繪本精選", tags: ["繪本", "低年級", "品格"], count: 20, status: "可借閱", targetClass: "-" },
            { id: "BOX-002", topic: "科普探索系列", tags: ["科普", "自然", "高年級"], count: 15, status: "已預約", targetClass: "908 班" },
            { id: "BOX-003", topic: "青少年經典文學", tags: ["文學", "小說", "高年級"], count: 12, status: "已借出", targetClass: "801 班" }
        ];

        let boxes = [];
        let currentPage = 1;
        let pageSize = 10;
        let selectedTag = "ALL";
        let selectedStatus = "ALL"; // 👈 新增：狀態篩選變數

        let mgmtCurrentPage = 1;
        let mgmtPageSize = 10;

        async function syncFromGoogleSheets() {
            const syncStatusEl = document.getElementById("syncStatus");
            const btnRefresh = document.getElementById("btnRefresh");
            if (syncStatusEl) syncStatusEl.innerHTML = `<span class="loading-spin">🔄</span> 同步中...`;
            if (btnRefresh) btnRefresh.disabled = true;

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                if (!res.ok) throw new Error("網路回應異常");

                const data = await res.json();
                if (Array.isArray(data)) {
                    boxes = data.map(item => ({
                        id: String(item.id || item[0] || ""),
                        topic: String(item.topic || item[1] || ""),
                        status: String(item.status || item[2] || "可借閱"),
                        count: parseInt(item.count || item[3]) || 0,
                        tags: item.tags ? (Array.isArray(item.tags) ? item.tags : String(item.tags).split(",")) : [],
                        targetClass: String(item.targetClass || item[5] || "-")
                    }));

                    saveBoxes();
                    renderUI();
                    if (syncStatusEl) syncStatusEl.innerHTML = `🟢 雲端已同步 (${new Date().toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'})})`;
                }
            } catch (e) {
                console.warn("無法從 Google 試算表讀取資料 (改用本地快取):", e);
                if (syncStatusEl) syncStatusEl.innerHTML = `🟡 本地快取模式`;
            } finally {
                if (btnRefresh) btnRefresh.disabled = false;
            }
        }

        async function postToGoogleSheets(action, payload) {
            const syncStatusEl = document.getElementById("syncStatus");
            if (syncStatusEl) syncStatusEl.innerHTML = `<span class="loading-spin">⏳</span> 儲存中...`;

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: action, ...payload })
                });

                if (syncStatusEl) syncStatusEl.innerHTML = `🟢 雲端已儲存`;
            } catch (e) {
                console.error("寫入至 Google 試算表失敗:", e);
                if (syncStatusEl) syncStatusEl.innerHTML = `🔴 儲存失敗 (僅存本地)`;
            }
        }

        function loadBoxesFromStorage() {
            const saved = localStorage.getItem("library_boxes");
            if (saved) {
                try { boxes = JSON.parse(saved); } catch (e) { boxes = defaultBoxes; }
            } else {
                boxes = defaultBoxes;
            }
        }

        function saveBoxes() {
            localStorage.setItem("library_boxes", JSON.stringify(boxes));
        }

        function renderTagFilters() {
            const tagContainer = document.getElementById("tagFilterButtons");
            if (!tagContainer) return;

            const allTags = new Set();
            boxes.forEach(box => {
                if (box.tags && Array.isArray(box.tags)) {
                    box.tags.forEach(t => allTags.add(t));
                }
            });

            let html = `<button class="tag-btn ${selectedTag === 'ALL' ? 'active' : ''}" onclick="filterByTag('ALL')">全部 (ALL)</button>`;
            allTags.forEach(tag => {
                html += `<button class="tag-btn ${selectedTag === tag ? 'active' : ''}" onclick="filterByTag('${tag}')"># ${tag}</button>`;
            });
            tagContainer.innerHTML = html;
        }

        function filterByTag(tag) {
            selectedTag = tag;
            currentPage = 1;
            renderUI();
        }

        // 👈 新增：點擊狀態快篩按鈕的邏輯
        function filterByStatus(status) {
            selectedStatus = status;
            currentPage = 1;
            
            // 更新狀態按鈕的 active 樣式
            ["statusAll", "statusReady", "statusReserved", "statusBorrowed"].forEach(id => {
                document.getElementById(id).classList.remove("active");
            });
            if (status === 'ALL') document.getElementById("statusAll").classList.add("active");
            if (status === '可借閱') document.getElementById("statusReady").classList.add("active");
            if (status === '已預約') document.getElementById("statusReserved").classList.add("active");
            if (status === '已借出') document.getElementById("statusBorrowed").classList.add("active");

            renderUI();
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById("pageSizeSelect").value) || 10;
            currentPage = 1;
            renderUI();
        }

        function changeMgmtPageSize() {
            mgmtPageSize = parseInt(document.getElementById("mgmtPageSizeSelect").value) || 10;
            mgmtCurrentPage = 1;
            renderUI();
        }

        function renderUI() {
            boxes.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true, sensitivity: 'base' }));

            renderTagFilters();

            // 1. 狀態篩選 + 標籤篩選雙重過濾
            let filteredBoxes = boxes;
            if (selectedStatus !== "ALL") {
                filteredBoxes = filteredBoxes.filter(box => box.status === selectedStatus);
            }
            if (selectedTag !== "ALL") {
                filteredBoxes = filteredBoxes.filter(box => box.tags && box.tags.includes(selectedTag));
            }

            const totalItems = filteredBoxes.length;
            const totalPages = Math.ceil(totalItems / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * pageSize;
            const pageBoxes = filteredBoxes.slice(startIndex, startIndex + pageSize);

            const tbody = document.getElementById("boxTableBody");
            const select = document.getElementById("selectBox");
            const staffHeader = document.getElementById("staffHeader");
            const mgmtTbody = document.getElementById("mgmtTableBody");

            if (tbody) tbody.innerHTML = "";
            if (select) select.innerHTML = "";
            if (mgmtTbody) mgmtTbody.innerHTML = "";

            if (staffHeader) {
                if (isStaff) {
                    staffHeader.classList.remove("hidden");
                    staffHeader.classList.add("staff-header-active");
                } else {
                    staffHeader.classList.add("hidden");
                    staffHeader.classList.remove("staff-header-active");
                }
            }

            document.querySelectorAll(".staff-col").forEach(el => {
                if (isStaff) el.classList.remove("hidden");
                else el.classList.add("hidden");
            });

            // 2. 渲染前台表格（加上圖示讓狀態一目了然）
            if (tbody) {
                pageBoxes.forEach(box => {
                    let statusClass = "status-ready";
                    let statusText = `🟢 ${box.status}`;
                    if (box.status === "已預約") {
                        statusClass = "status-reserved";
                        statusText = `🟠 ${box.status}`;
                    }
                    if (box.status === "已借出") {
                        statusClass = "status-borrowed";
                        statusText = `🔴 ${box.status}`;
                    }

                    const topicWithLink = `<a href="box-detail.html?id=${box.id}" target="_blank" class="opac-link" title="查看與編輯 ${box.topic}">${box.topic} 🖼️</a>`;
                    const tagBadges = (box.tags || []).map(t => `<span class="tag-badge">#${t}</span>`).join("") || "-";

                    let staffActionBtn = "-";
                    if (isStaff) {
                        if (box.status === "已預約") {
                            staffActionBtn = `<button class="btn-checkout" onclick="confirmCheckout('${box.id}')">確實借出 (${box.targetClass})</button>`;
                        } else if (box.status === "已借出") {
                            staffActionBtn = `<button class="btn-return" onclick="returnBox('${box.id}')">辦理歸還</button>`;
                        }
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><b>${box.id}</b></td>
                            <td>${topicWithLink}</td>
                            <td>${tagBadges}</td>
                            <td>${box.count} 本</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td><b>${box.targetClass}</b></td>
                            <td class="staff-col ${isStaff ? '' : 'hidden'}">${staffActionBtn}</td>
                        </tr>
                    `;
                });
            }

            // 3. 後台渲染
            if (isStaff && mgmtTbody) {
                const mgmtTotalItems = boxes.length;
                const mgmtTotalPages = Math.ceil(mgmtTotalItems / mgmtPageSize) || 1;
                if (mgmtCurrentPage > mgmtTotalPages) mgmtCurrentPage = mgmtTotalPages;

                const mgmtStartIndex = (mgmtCurrentPage - 1) * mgmtPageSize;
                const mgmtPageBoxes = boxes.slice(mgmtStartIndex, mgmtStartIndex + mgmtPageSize);

                mgmtPageBoxes.forEach(box => {
                    let statusClass = "status-ready";
                    let statusText = `🟢 ${box.status}`;
                    if (box.status === "已預約") { statusClass = "status-reserved"; statusText = `🟠 ${box.status}`; }
                    if (box.status === "已借出") { statusClass = "status-borrowed"; statusText = `🔴 ${box.status}`; }
                    const tagBadges = (box.tags || []).map(t => `<span class="tag-badge">#${t}</span>`).join("") || "-";

                    mgmtTbody.innerHTML += `
                        <tr>
                            <td><b>${box.id}</b></td>
                            <td>${box.topic}</td>
                            <td>${tagBadges}</td>
                            <td>${box.count} 本</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>
                                <button class="btn-edit" onclick="editBox('${box.id}')">編輯資料</button>
                                <button class="btn-delete" onclick="deleteBox('${box.id}')">移除</button>
                            </td>
                        </tr>
                    `;
                });

                renderMgmtPagination(mgmtTotalItems, mgmtTotalPages);
            }

            // 4. 下拉選單更新
            if (select) {
                boxes.forEach(box => {
                    if (box.status === "可借閱") {
                        select.innerHTML += `<option value="${box.id}">${box.id} (${box.topic})</option>`;
                    }
                });
                if (select.innerHTML === "") {
                    select.innerHTML = `<option value="">-- 目前無可預約箱書 --</option>`;
                }
            }

            renderPagination(totalItems, totalPages);
        }

        function renderPagination(totalItems, totalPages) {
            const infoEl = document.getElementById("pageInfo");
            const btnContainer = document.getElementById("paginationButtons");
            if (!infoEl || !btnContainer) return;

            infoEl.innerText = `共 ${totalItems} 筆資料 | 第 ${currentPage} / ${totalPages} 頁`;
            btnContainer.innerHTML = "";

            const prevBtn = document.createElement("button");
            prevBtn.className = "page-btn";
            prevBtn.innerText = "◄ 上一頁";
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderUI(); };
            btnContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pBtn = document.createElement("button");
                pBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pBtn.innerText = i;
                pBtn.onclick = () => { currentPage = i; renderUI(); };
                btnContainer.appendChild(pBtn);
            }

            const nextBtn = document.createElement("button");
            nextBtn.className = "page-btn";
            nextBtn.innerText = "下一頁 ►";
            nextBtn.disabled = currentPage === totalPages || totalPages === 0;
            nextBtn.onclick = () => { currentPage++; renderUI(); };
            btnContainer.appendChild(nextBtn);
        }

        function renderMgmtPagination(totalItems, totalPages) {
            const infoEl = document.getElementById("mgmtPageInfo");
            const btnContainer = document.getElementById("mgmtPaginationButtons");
            if (!infoEl || !btnContainer) return;

            infoEl.innerText = `共 ${totalItems} 筆資料 | 第 ${mgmtCurrentPage} / ${totalPages} 頁`;
            btnContainer.innerHTML = "";

            const prevBtn = document.createElement("button");
            prevBtn.className = "page-btn";
            prevBtn.innerText = "◄ 上一頁";
            prevBtn.disabled = mgmtCurrentPage === 1;
            prevBtn.onclick = () => { mgmtCurrentPage--; renderUI(); };
            btnContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pBtn = document.createElement("button");
                pBtn.className = `page-btn ${i === mgmtCurrentPage ? 'active' : ''}`;
                pBtn.innerText = i;
                pBtn.onclick = () => { mgmtCurrentPage = i; renderUI(); };
                btnContainer.appendChild(pBtn);
            }

            const nextBtn = document.createElement("button");
            nextBtn.className = "page-btn";
            nextBtn.innerText = "下一頁 ►";
            nextBtn.disabled = mgmtCurrentPage === totalPages || totalPages === 0;
            nextBtn.onclick = () => { mgmtCurrentPage++; renderUI(); };
            btnContainer.appendChild(nextBtn);
        }

        async function reserveBox() {
            const boxId = document.getElementById("selectBox").value;
            const className = document.getElementById("classInput").value.trim();

            if (!boxId) { alert("目前沒有可預約的箱書！"); return; }
            if (!className) { alert("請輸入預約班級！"); return; }

            const targetBox = boxes.find(b => b.id === boxId);
            if (targetBox) {
                const fullClassName = className.includes("班") ? className : className + " 班";
                targetBox.status = "已預約";
                targetBox.targetClass = fullClassName;
                document.getElementById("classInput").value = "";
                
                saveBoxes();
                renderUI();

                await postToGoogleSheets("updateStatus", {
                    id: boxId,
                    status: "已預約",
                    targetClass: fullClassName
                });

                alert(`【預約成功】\n\n${targetBox.targetClass} 已預約 ${targetBox.id}！隔日起可至教務處找閱推老師辦理正式借閱與領取！`);
            }
        }

        async function confirmCheckout(boxId) {
            const targetBox = boxes.find(b => b.id === boxId);
            if (targetBox && confirm(`確認辦理借出嗎？`)) {
                targetBox.status = "已借出";
                saveBoxes();
                renderUI();

                await postToGoogleSheets("updateStatus", {
                    id: boxId,
                    status: "已借出",
                    targetClass: targetBox.targetClass
                });
            }
        }

        async function returnBox(boxId) {
            const targetBox = boxes.find(b => b.id === boxId);
            if (targetBox && confirm(`確認辦理歸還嗎？`)) {
                targetBox.status = "可借閱";
                targetBox.targetClass = "-";
                saveBoxes();
                renderUI();

                await postToGoogleSheets("updateStatus", {
                    id: boxId,
                    status: "可借閱",
                    targetClass: "-"
                });
            }
        }

        async function editBox(boxId) {
            const targetBox = boxes.find(b => b.id === boxId);
            if (!targetBox) return;

            const newTopic = prompt(`請輸入 ${boxId} 的新主題：`, targetBox.topic);
            if (newTopic === null) return;
            const currentTagsStr = (targetBox.tags || []).join(",");
            const newTagsStr = prompt(`請輸入 ${boxId} 的標籤 (請用半角逗號分隔)：`, currentTagsStr);
            if (newTagsStr === null) return;
            const newCount = prompt(`請輸入 ${boxId} 的新冊數：`, targetBox.count);
            if (newCount === null) return;

            targetBox.topic = newTopic.trim();
            targetBox.tags = newTagsStr.split(",").map(t => t.trim()).filter(t => t !== "");
            targetBox.count = parseInt(newCount) || targetBox.count;
            
            saveBoxes();
            renderUI();

            await postToGoogleSheets("edit", {
                id: boxId,
                topic: targetBox.topic,
                tags: targetBox.tags.join(","),
                count: targetBox.count
            });
        }

        async function deleteBox(boxId) {
            const targetBox = boxes.find(b => b.id === boxId);
            if (targetBox && confirm(`確定要刪除 ${boxId} 嗎？`)) {
                await postToGoogleSheets("delete", { id: boxId });        
                boxes = boxes.filter(b => b.id !== boxId);
                saveBoxes();
                renderUI();
                alert("已成功刪除箱書！");
            }
        }

        function toggleMode() {
            if (!isStaff) {
                const password = prompt("請輸入閱推老師管理密碼");
                if (password === STAFF_PASSWORD) {
                    isStaff = true;
                    document.getElementById("roleBadge").innerHTML = "當前身分：<b style='color:#d35400;'>🛠️ 閱推老師管理模式</b>";
                    document.getElementById("authBtn").innerText = "登出管理模式";
                    document.getElementById("staffPanel").classList.remove("hidden");
                } else if (password !== null) { alert("密碼錯誤！"); }
            } else {
                isStaff = false;
                document.getElementById("roleBadge").innerHTML = "當前身分：<b>📖 班級預約模式</b>";
                document.getElementById("authBtn").innerText = "閱推老師登入";
                document.getElementById("staffPanel").classList.add("hidden");
            }
            renderUI();
        }

        async function addNewBox() {
            const id = document.getElementById("newId").value.trim();
            const topic = document.getElementById("newTopic").value.trim();
            const tagsStr = document.getElementById("newTags").value.trim();
            const count = document.getElementById("newCount").value;

            if (!id || !topic || !count) { alert("請填寫完整！"); return; }
            if (boxes.some(b => b.id === id)) { alert("該箱號已存在！"); return; }

            const tagsArr = tagsStr ? tagsStr.split(",").map(t => t.trim()).filter(t => t !== "") : [];
            const newBox = { id: id, topic: topic, tags: tagsArr, count: parseInt(count), status: "可借閱", targetClass: "-" };

            boxes.push(newBox);
            document.getElementById("newId").value = "";
            document.getElementById("newTopic").value = "";
            document.getElementById("newTags").value = "";
            document.getElementById("newCount").value = "";
            
            saveBoxes();
            renderUI();

            await postToGoogleSheets("add", {
                id: id,
                topic: topic,
                tags: tagsArr.join(","),
                count: parseInt(count),
                status: "可借閱",
                targetClass: "-"
            });
        }

        window.addEventListener('load', async function () {
            loadBoxesFromStorage();
            renderUI();
            await syncFromGoogleSheets();
            setInterval(() => { syncFromGoogleSheets(); }, 15000);
        });

        window.addEventListener('pageshow', function () {
            renderUI();
        });
    </script>
</body>
</html>
